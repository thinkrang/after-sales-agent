name: quality

on:
  push:
  pull_request:

jobs:
  core-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 只装轻量依赖：不拉 torch / chromadb / sentence-transformers，
      # 所以这一步几十秒能跑完。需要完整运行时的测试用 -k 排除。
      - name: Install lightweight test dependencies
        run: pip install "pytest==9.1.1" "fastapi==0.147.0" "pydantic==2.13.5" "httpx==0.28.1" "python-dotenv==1.2.3"

      - name: Compile core modules
        run: |
          python -m py_compile \
            settings.py db.py auth.py orders.py tickets.py risk.py refund_service.py \
            api.py rag.py tasks.py rebuild_index.py reconcile_refunds.py \
            action_eval.py action_eval_model.py

      # 这一组是安全与业务的核心回归：
      #   test_refund_workflow  审批绑定、原子迁移、幂等、失败重试语义
      #   test_risk             风险分级规则的边界与确定性
      #   test_action_safety    44 条动作轨迹里的 36 条确定性场景
      #   test_tickets          状态机
      #   test_auth             认证四个关键点
      #
      # -k "not run_one" 跳过 tests/test_eval_dataset.py 里三个懒加载
      # evaluate_agent 的用例：那会连带导入 api -> rag ->
      # sentence-transformers / langchain_chroma，本 job 没装这些包。
      # 评测集本身的结构校验仍然会跑。
      - name: Security, risk and workflow tests
        run: |
          python -X utf8 -m pytest \
            tests/test_refund_workflow.py \
            tests/test_tickets.py \
            tests/test_risk.py \
            tests/test_action_safety.py \
            tests/test_eval_dataset.py \
            tests/test_auth.py::test_password_hash_round_trip \
            tests/test_auth.py::test_access_token_round_trip_and_expiry \
            tests/test_auth.py::test_tampered_token_is_rejected \
            tests/test_auth.py::test_demo_login_is_tenant_bound \
            -q -o addopts="" -k "not run_one"

      # 单独跑一次脚本，把"危险动作误执行数"打在日志里。
      # 只靠 pytest 的红绿看不出具体是 0 还是 1，这个数字要可见。
      - name: Action-level safety report
        run: python action_eval.py

      - name: Check inline frontend JavaScript syntax
        run: |
          node -e '
            const fs = require("fs");
            for (const file of ["index.html", "knowledge.html"]) {
              const html = fs.readFileSync(file, "utf8");
              for (const match of html.matchAll(/<script>([\s\S]*?)<\/script>/g)) {
                new Function(match[1]);
              }
            }
            console.log("inline JavaScript syntax OK");
          '
