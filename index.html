<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Agent</title>
<style>
:root{
  --bg:#fff; --side:#f9f9f9; --side-hover:#efeff0; --side-active:#e7e7e9;
  --border:#e9e9ea; --text:#1d1d1f; --dim:#87878d; --faint:#b2b2b8;
  --accent:#2563eb; --user-bubble:#f1f5fb; --code-bg:#f6f6f7; --chip:#f3f4f6;
  --shadow:0 1px 2px rgba(0,0,0,.04);
}
html[data-theme="dark"]{
  --bg:#1e1e20; --side:#171718; --side-hover:#252527; --side-active:#2d2d30;
  --border:#2e2e31; --text:#ececee; --dim:#9a9aa0; --faint:#6b6b70;
  --accent:#6ea8ff; --user-bubble:#2a2a2d; --code-bg:#141416; --chip:#26262a;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-size:15px;color:var(--text);background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
button{font:inherit;color:inherit}

/* ---------- 布局 ---------- */
.app{display:flex;height:100dvh;overflow:hidden}

/* ---------- 侧边栏 ---------- */
.sidebar{
  width:264px;flex:0 0 264px;background:var(--side);border-right:1px solid var(--border);
  display:flex;flex-direction:column;transition:margin-left .22s ease;
}
.side-head{display:flex;align-items:center;gap:9px;padding:14px 14px 10px}
.brand-mark{
  width:28px;height:28px;flex:0 0 28px;border-radius:9px;background:var(--accent);
  display:grid;place-items:center;font-size:15px;
}
.brand-name{font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.brand-sub{font-size:11px;color:var(--faint);margin-top:1px}
.new-chat{
  margin:0 12px 8px;padding:9px 12px;display:flex;align-items:center;gap:8px;
  border:1px solid var(--border);background:var(--bg);border-radius:10px;
  font-size:13.5px;font-weight:500;cursor:pointer;
  transition:background .15s,border-color .15s;
}
.new-chat:hover{background:var(--side-hover);border-color:var(--faint)}
.sessions{flex:1;overflow-y:auto;padding:2px 8px 8px;overscroll-behavior:contain}
.group-label{font-size:11.5px;color:var(--faint);padding:11px 8px 5px;font-weight:500}
.sess{
  position:relative;display:flex;align-items:center;gap:4px;
  padding:8px 9px;border-radius:9px;cursor:pointer;margin-bottom:1px;
}
.sess:hover{background:var(--side-hover)}
.sess.active{background:var(--side-active)}
.sess-title{
  flex:1;min-width:0;font-size:13.5px;line-height:1.4;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.sess-acts{display:none;gap:1px;flex:0 0 auto}
.sess:hover .sess-acts,.sess.active .sess-acts{display:flex}
.act{
  width:22px;height:22px;display:grid;place-items:center;padding:0;
  border:0;background:transparent;border-radius:6px;color:var(--dim);
  cursor:pointer;font-size:12px;line-height:1;
}
.act:hover{background:var(--bg);color:var(--text)}
.act.danger:hover{color:#e5484d}
input.rename{
  flex:1;min-width:0;font:inherit;font-size:13.5px;color:var(--text);
  background:var(--bg);border:1px solid var(--accent);border-radius:6px;
  padding:2px 6px;outline:none;
}
.sessions-empty{padding:16px 10px;font-size:12.5px;color:var(--faint);text-align:center;line-height:1.7}
.side-foot{
  border-top:1px solid var(--border);padding:9px 12px;
  display:flex;flex-direction:column;gap:2px;
}
.foot-link{
  display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;
  border:0;background:transparent;border-radius:9px;text-decoration:none;
  font-size:13.5px;color:var(--text);cursor:pointer;
}
.foot-link:hover{background:var(--side-hover)}

/* ---------- 主区域 ---------- */
.chat{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.chat-top{
  height:56px;flex:0 0 56px;display:flex;align-items:center;gap:10px;
  padding:0 16px;border-bottom:1px solid var(--border);
}
.chat-title{
  flex:1;min-width:0;font-size:14.5px;font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.icon-btn{
  width:32px;height:32px;flex:0 0 32px;display:grid;place-items:center;padding:0;
  border:0;background:transparent;border-radius:8px;color:var(--dim);
  cursor:pointer;font-size:16px;
}
.icon-btn:hover{background:var(--side-hover);color:var(--text)}
.menu-btn{display:none}
.pill{
  font-size:11.5px;color:var(--dim);border:1px solid var(--border);
  border-radius:999px;padding:3px 9px;white-space:nowrap;
}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain}
.thread{max-width:768px;margin:0 auto;padding:26px 22px 36px;display:flex;flex-direction:column;gap:20px}

/* ---------- 消息 ---------- */
.turn{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:12px;align-items:flex-start}
.row.user{justify-content:flex-end}
.bubble{
  max-width:min(80%,620px);background:var(--user-bubble);padding:10px 15px;
  border-radius:16px;border-bottom-right-radius:5px;line-height:1.65;
  font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere;
}
.avatar{
  width:28px;height:28px;flex:0 0 28px;border-radius:8px;background:var(--accent);
  display:grid;place-items:center;font-size:14px;margin-top:2px;
}
.content{flex:1;min-width:0;font-size:14.5px;line-height:1.72;overflow-wrap:anywhere}
.content.plain{white-space:pre-wrap}
.content.streaming::after{
  content:"";display:inline-block;width:7px;height:15px;margin-left:3px;
  background:var(--accent);border-radius:2px;vertical-align:-2px;
  animation:blink .9s steps(1) infinite;
}
@keyframes blink{50%{opacity:0}}
.content p{margin:0 0 10px}
.content p:last-child{margin-bottom:0}
.content h3,.content h4{margin:15px 0 8px;font-size:15px;font-weight:600}
.content ul{margin:0 0 10px;padding-left:20px}
.content li{margin:3px 0}
.content code{
  background:var(--code-bg);padding:1.5px 5px;border-radius:5px;
  font-size:12.8px;font-family:ui-monospace,Consolas,"Courier New",monospace;
}
.content pre.code{
  background:var(--code-bg);padding:12px 14px;border-radius:10px;
  overflow-x:auto;margin:0 0 10px;
}
.content pre.code code{background:none;padding:0;font-size:12.8px;line-height:1.6}
.content strong{font-weight:600}

/* 工具调用 */
.tool-row{display:flex;align-items:center;gap:7px;padding-left:40px}
.chip{
  display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--dim);
  background:var(--chip);border-radius:999px;padding:5px 11px;
}
.chip b{font-weight:500;color:var(--text)}
details.tool-res{padding-left:40px;font-size:12.5px}
details.tool-res summary{
  cursor:pointer;color:var(--dim);list-style:none;
  display:inline-flex;align-items:center;gap:5px;padding:2px 0;
}
details.tool-res summary::-webkit-details-marker{display:none}
details.tool-res summary:hover{color:var(--text)}
details.tool-res pre{
  white-space:pre-wrap;overflow-wrap:anywhere;background:var(--code-bg);
  padding:10px 12px;border-radius:9px;margin:6px 0 0;font-size:12.3px;
  line-height:1.6;max-height:260px;overflow:auto;
  font-family:ui-monospace,Consolas,monospace;
}
.thinking{display:flex;align-items:center;gap:9px;padding-left:40px;color:var(--dim);font-size:13px}
.dots{display:inline-flex;gap:3px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--faint);animation:bounce 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}
.dots i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.err{color:#e5484d;font-size:13.5px}

/* ---------- 审批卡片 ---------- */
.approval{
  margin-left:40px;max-width:520px;padding:14px 16px;
  border:1px solid var(--border);border-radius:14px;background:var(--bg);
  box-shadow:var(--shadow);
}
.approval-head{font-size:12.5px;color:var(--accent);font-weight:500;margin-bottom:10px}
.approval-tool{font-size:13.5px;font-weight:500;margin-bottom:8px}
.approval-tool code{
  background:var(--code-bg);padding:1px 6px;border-radius:5px;
  font-size:12.5px;font-family:ui-monospace,Consolas,monospace;
}
.approval-args{display:flex;flex-direction:column;gap:5px;font-size:12.5px;margin-bottom:12px}
.approval-args .k{color:var(--dim);margin-right:6px}
.approval-args .v{font-family:ui-monospace,Consolas,monospace}
.approval-actions{display:flex;gap:8px;justify-content:flex-end}
.approval-actions button{
  padding:7px 15px;border-radius:9px;font-size:13px;cursor:pointer;
  border:1px solid var(--border);background:var(--bg);transition:.15s;
}
.approval-actions .reject:hover{background:var(--side-hover);border-color:var(--faint)}
.approval-actions .approve{background:var(--accent);color:#fff;border-color:var(--accent)}
.approval-actions .approve:hover{opacity:.88}
.approval-actions button:disabled{opacity:.45;cursor:not-allowed}
.approval-done{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--dim)}
.approval-done.ok{color:#1D9E75}
.approval-done.no{color:#D85A30}

/* ---------- 欢迎页 ---------- */
.welcome{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100%;text-align:center;padding:40px 20px;
}
.welcome-mark{
  width:56px;height:56px;border-radius:17px;background:var(--accent);
  display:grid;place-items:center;font-size:27px;margin-bottom:16px;
}
.welcome h2{margin:0 0 7px;font-size:21px;font-weight:600;letter-spacing:-.015em}
.welcome p{margin:0;color:var(--dim);font-size:13.5px;line-height:1.6}
.sugs{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:24px;max-width:540px}
.sug{
  border:1px solid var(--border);background:var(--bg);border-radius:12px;
  padding:9px 14px;font-size:13px;cursor:pointer;
  transition:background .15s,border-color .15s;
}
.sug:hover{background:var(--side-hover);border-color:var(--faint)}
.hist-loading{padding:40px;text-align:center;color:var(--faint);font-size:13px}

/* ---------- 输入区 ---------- */
.composer{padding:0 22px 16px;background:var(--bg)}
.composer-inner{
  max-width:768px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;
  border:1px solid var(--border);border-radius:16px;padding:7px 7px 7px 14px;
  background:var(--bg);box-shadow:var(--shadow);transition:border-color .15s;
}
.composer-inner:focus-within{border-color:var(--accent)}
#input{
  flex:1;min-width:0;border:0;outline:none;resize:none;background:transparent;
  color:var(--text);font:inherit;font-size:14.5px;line-height:1.6;
  padding:7px 0;max-height:180px;
}
.send-btn{
  width:34px;height:34px;flex:0 0 34px;display:grid;place-items:center;
  border:0;border-radius:10px;background:var(--accent);color:#fff;
  font-size:15px;cursor:pointer;transition:opacity .15s;
}
.send-btn:disabled{opacity:.32;cursor:not-allowed}
.hint{max-width:768px;margin:7px auto 0;text-align:center;font-size:11.5px;color:var(--faint)}

/* ---------- 提示条 ---------- */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);
  background:#2b2b2e;color:#fff;font-size:13px;padding:9px 16px;
  border-radius:10px;opacity:0;pointer-events:none;transition:.22s;z-index:60;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- 移动端 ---------- */
.backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.36);z-index:20}
@media (max-width:820px){
  .sidebar{position:fixed;top:0;bottom:0;left:0;z-index:30;margin-left:-264px;box-shadow:0 0 40px rgba(0,0,0,.18)}
  .sidebar.open{margin-left:0}
  .backdrop.show{display:block}
  .menu-btn{display:grid}
  .thread{padding:18px 14px 28px}
  .bubble{max-width:88%}
  .composer{padding:0 12px 12px}
  .tool-row,details.tool-res,.thinking,.approval{padding-left:0}
  .approval{margin-left:0;max-width:100%}
}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <div class="brand-mark">🤖</div>
      <div>
        <div class="brand-name">Mini Agent</div>
        <div class="brand-sub">LangChain · RAG · DeepSeek</div>
      </div>
    </div>

    <button class="new-chat" id="newChat"><span>＋</span> 新对话</button>

    <div class="sessions" id="sessionList"></div>

    <div class="side-foot">
      <a class="foot-link" href="/knowledge"><span>📚</span> 知识库管理</a>
      <button class="foot-link" id="themeToggle"><span id="themeIcon">🌙</span> <span id="themeText">深色模式</span></button>
    </div>
  </aside>

  <div class="backdrop" id="backdrop"></div>

  <main class="chat">
    <header class="chat-top">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="打开侧边栏">☰</button>
      <div class="chat-title" id="chatTitle">新对话</div>
      <span class="pill">DeepSeek</span>
    </header>

    <div class="scroll" id="scroll">
      <div class="thread" id="thread"></div>
    </div>

    <div class="composer">
      <div class="composer-inner">
        <textarea id="input" rows="1" placeholder="给 Mini Agent 发送消息…"></textarea>
        <button class="send-btn" id="send" aria-label="发送">↑</button>
      </div>
      <div class="hint">Enter 发送 · Shift + Enter 换行 · 回答由 DeepSeek 生成</div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  /* ============ 元素与状态 ============ */
  const el = {
    sidebar: document.getElementById("sidebar"),
    backdrop: document.getElementById("backdrop"),
    menuBtn: document.getElementById("menuBtn"),
    sessionList: document.getElementById("sessionList"),
    newChat: document.getElementById("newChat"),
    chatTitle: document.getElementById("chatTitle"),
    scroll: document.getElementById("scroll"),
    thread: document.getElementById("thread"),
    input: document.getElementById("input"),
    send: document.getElementById("send"),
    themeToggle: document.getElementById("themeToggle"),
    themeIcon: document.getElementById("themeIcon"),
    themeText: document.getElementById("themeText"),
    toast: document.getElementById("toast"),
  };

  const state = {
    sessions: [],
    currentId: null,
    loading: false,
    stick: true,
  };

  const SUGGESTIONS = [
    "你们的退货政策是什么？",
    "付款后多久发货？",
    "买 3 个单价 99.9 的商品一共多少钱？",
  ];

  /* ============ 通用工具 ============ */
  function toast(msg) {
    el.toast.textContent = msg;
    el.toast.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.toast.classList.remove("show"), 2600);
  }

  async function api(path, opts) {
    const options = Object.assign({ headers: { "Content-Type": "application/json" } }, opts || {});
    const res = await fetch(path, options);
    if (!res.ok) {
      let msg = "HTTP " + res.status;
      try {
        const body = await res.json();
        if (typeof body.detail === "string") msg = body.detail;
      } catch (_) {}
      throw new Error(msg);
    }
    if (res.status === 204) return null;
    return res.json();
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  /* ============ 轻量 Markdown ============ */
  function md(src) {
    const blocks = [];
    let s = escapeHtml(src);

    s = s.replace(/```[a-zA-Z0-9]*\n?([\s\S]*?)```/g, (m, code) => {
      blocks.push('<pre class="code"><code>' + code.replace(/\n$/, "") + "</code></pre>");
      return "\u0000B" + (blocks.length - 1) + "\u0000";
    });

    s = s.replace(/`([^`\n]+)`/g, "<code>$1</code>");
    s = s.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/^#{1,6}\s+(.+)$/gm, "<h4>$1</h4>");

    s = s.replace(/(?:^|\n)((?:[-*]\s+.+(?:\n|$))+)/g, (m, body) => {
      const items = body.trim().split("\n")
        .map((line) => "<li>" + line.replace(/^[-*]\s+/, "") + "</li>")
        .join("");
      return "\n<ul>" + items + "</ul>\n";
    });

    s = s.split(/\n{2,}/).map((p) => {
      const t = p.trim();
      if (!t) return "";
      if (/^<(h4|ul|pre)/.test(t) || /^\u0000B/.test(t)) return t;
      return "<p>" + t.replace(/\n/g, "<br>") + "</p>";
    }).join("");

    return s.replace(/\u0000B(\d+)\u0000/g, (m, i) => blocks[+i]);
  }

  /* ============ 滚动 ============ */
  el.scroll.addEventListener("scroll", () => {
    const gap = el.scroll.scrollHeight - el.scroll.scrollTop - el.scroll.clientHeight;
    state.stick = gap < 90;
  });

  function scrollToBottom(force) {
    if (!force && !state.stick) return;
    el.scroll.scrollTop = el.scroll.scrollHeight;
  }

  /* ============ 主题 ============ */
  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    const dark = theme === "dark";
    el.themeIcon.textContent = dark ? "☀️" : "🌙";
    el.themeText.textContent = dark ? "浅色模式" : "深色模式";
    localStorage.setItem("theme", theme);
  }

  el.themeToggle.onclick = () => {
    applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
  };

  /* ============ 侧边栏抽屉 ============ */
  function openDrawer() {
    el.sidebar.classList.add("open");
    el.backdrop.classList.add("show");
  }
  function closeDrawer() {
    el.sidebar.classList.remove("open");
    el.backdrop.classList.remove("show");
  }
  el.menuBtn.onclick = openDrawer;
  el.backdrop.onclick = closeDrawer;

  /* ============ 会话列表 ============ */
  function groupOf(ts) {
    const d = new Date(ts.replace(" ", "T"));
    if (isNaN(d)) return "更早";
    const startOf = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
    const days = Math.round((startOf(new Date()) - startOf(d)) / 86400000);
    if (days <= 0) return "今天";
    if (days === 1) return "昨天";
    if (days < 7) return "7 天内";
    return "更早";
  }

  async function loadSessions() {
    const data = await api("/sessions");
    state.sessions = data.sessions || [];
  }

  function sessionEl(s) {
    const row = document.createElement("div");
    row.className = "sess" + (s.id === state.currentId ? " active" : "");
    row.dataset.id = s.id;

    const title = document.createElement("div");
    title.className = "sess-title";
    title.textContent = s.title;

    const acts = document.createElement("div");
    acts.className = "sess-acts";

    const btnRename = document.createElement("button");
    btnRename.className = "act";
    btnRename.textContent = "✎";
    btnRename.title = "重命名";
    btnRename.onclick = (e) => { e.stopPropagation(); startRename(row, title, s); };

    const btnDel = document.createElement("button");
    btnDel.className = "act danger";
    btnDel.textContent = "🗑";
    btnDel.title = "删除";
    btnDel.onclick = (e) => { e.stopPropagation(); removeSession(s); };

    acts.appendChild(btnRename);
    acts.appendChild(btnDel);
    row.appendChild(title);
    row.appendChild(acts);
    row.onclick = () => selectSession(s.id);

    return row;
  }

  function renderSessions() {
    el.sessionList.innerHTML = "";
    if (!state.sessions.length) {
      const empty = document.createElement("div");
      empty.className = "sessions-empty";
      empty.textContent = "还没有会话，发一条消息就会自动创建";
      el.sessionList.appendChild(empty);
      return;
    }

    const groups = new Map();
    for (const s of state.sessions) {
      const g = groupOf(s.updated_at);
      if (!groups.has(g)) groups.set(g, []);
      groups.get(g).push(s);
    }

    for (const [label, items] of groups) {
      const h = document.createElement("div");
      h.className = "group-label";
      h.textContent = label;
      el.sessionList.appendChild(h);
      items.forEach((s) => el.sessionList.appendChild(sessionEl(s)));
    }
  }

  function startRename(row, titleEl, s) {
    if (row.querySelector("input.rename")) return;
    const input = document.createElement("input");
    input.className = "rename";
    input.value = s.title;
    input.maxLength = 40;
    titleEl.replaceWith(input);
    input.focus();
    input.select();

    let done = false;
    const finish = async (save) => {
      if (done) return;
      done = true;
      const value = input.value.trim();
      if (save && value && value !== s.title) {
        try {
          await api("/sessions/" + s.id, {
            method: "PATCH",
            body: JSON.stringify({ title: value }),
          });
          s.title = value;
          if (state.currentId === s.id) el.chatTitle.textContent = value;
        } catch (err) {
          toast("重命名失败：" + err.message);
        }
      }
      input.replaceWith(titleEl);
      titleEl.textContent = s.title;
    };

    input.onkeydown = (e) => {
      if (e.key === "Enter") { e.preventDefault(); finish(true); }
      else if (e.key === "Escape") { e.preventDefault(); finish(false); }
    };
    input.onblur = () => finish(true);
  }

  async function removeSession(s) {
    if (state.loading) { toast("请等待当前回答完成"); return; }
    if (!confirm('删除会话「' + s.title + '」？\n该会话的对话记录会一并删除，无法恢复。')) return;

    try {
      await api("/sessions/" + s.id, { method: "DELETE" });
      state.sessions = state.sessions.filter((x) => x.id !== s.id);

      if (state.currentId === s.id) {
        if (state.sessions.length) {
          await selectSession(state.sessions[0].id);
        } else {
          state.currentId = null;
          el.chatTitle.textContent = "新对话";
          renderSessions();
          showWelcome();
        }
      } else {
        renderSessions();
      }
      toast("会话已删除");
    } catch (err) {
      toast("删除失败：" + err.message);
    }
  }

  /* ============ 消息渲染 ============ */
  function clearThread() {
    el.thread.innerHTML = "";
  }

  function showWelcome() {
    clearThread();
    const wrap = document.createElement("div");
    wrap.className = "welcome";
    wrap.innerHTML =
      '<div class="welcome-mark">🤖</div>' +
      "<h2>有什么可以帮你？</h2>" +
      "<p>我可以查询店铺知识库、计算订单金额</p>";

    const sugs = document.createElement("div");
    sugs.className = "sugs";
    SUGGESTIONS.forEach((text) => {
      const b = document.createElement("button");
      b.className = "sug";
      b.textContent = text;
      b.onclick = () => {
        el.input.value = text;
        autoGrow();
        send();
      };
      sugs.appendChild(b);
    });

    wrap.appendChild(sugs);
    el.thread.appendChild(wrap);
    state.stick = true;
  }

  function removeWelcome() {
    const w = el.thread.querySelector(".welcome");
    if (w) w.remove();
  }

  function rowUser(text) {
    const row = document.createElement("div");
    row.className = "row user";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    row.appendChild(bubble);
    el.thread.appendChild(row);
    return row;
  }

  function rowToolCall(name) {
    const row = document.createElement("div");
    row.className = "tool-row";
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.innerHTML = "🔧 调用 <b>" + escapeHtml(name || "工具") + "</b>";
    row.appendChild(chip);
    el.thread.appendChild(row);
    return row;
  }

  function rowToolResult(name, text) {
    const box = document.createElement("details");
    box.className = "tool-res";
    const sum = document.createElement("summary");
    sum.textContent = "▸ " + (name || "工具") + " 返回结果";
    const pre = document.createElement("pre");
    pre.textContent = text;
    box.appendChild(sum);
    box.appendChild(pre);
    el.thread.appendChild(box);
    return box;
  }

  function createAssistantRow() {
    const row = document.createElement("div");
    row.className = "row";
    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = "🤖";
    const content = document.createElement("div");
    content.className = "content plain";
    row.appendChild(avatar);
    row.appendChild(content);
    el.thread.appendChild(row);
    return content;
  }

  function renderHistory(messages) {
    clearThread();
    if (!messages || !messages.length) {
      showWelcome();
      return;
    }

    let turn = null;
    let content = null;

    for (const m of messages) {
      if (m.role === "user") {
        turn = document.createElement("div");
        turn.className = "turn";
        el.thread.appendChild(turn);
        const row = document.createElement("div");
        row.className = "row user";
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = m.text;
        row.appendChild(bubble);
        turn.appendChild(row);
        content = null;
      } else if (m.role === "tool_call") {
        if (!turn) {
          turn = document.createElement("div");
          turn.className = "turn";
          el.thread.appendChild(turn);
        }
        const row = document.createElement("div");
        row.className = "tool-row";
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.innerHTML = "🔧 调用 <b>" + escapeHtml(m.name || "工具") + "</b>";
        row.appendChild(chip);
        turn.appendChild(row);
      } else if (m.role === "tool_result") {
        if (!turn) {
          turn = document.createElement("div");
          turn.className = "turn";
          el.thread.appendChild(turn);
        }
        const box = document.createElement("details");
        box.className = "tool-res";
        const sum = document.createElement("summary");
        sum.textContent = "▸ " + (m.name || "工具") + " 返回结果";
        const pre = document.createElement("pre");
        pre.textContent = m.text;
        box.appendChild(sum);
        box.appendChild(pre);
        turn.appendChild(box);
      } else if (m.role === "assistant") {
        if (!turn) {
          turn = document.createElement("div");
          turn.className = "turn";
          el.thread.appendChild(turn);
        }
        const row = document.createElement("div");
        row.className = "row";
        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = "🤖";
        const box = document.createElement("div");
        box.className = "content";
        box.innerHTML = md(m.text);
        row.appendChild(avatar);
        row.appendChild(box);
        turn.appendChild(row);
      }
    }

    state.stick = true;
    scrollToBottom(true);
  }

  /* ============ 切换会话 ============ */
  async function selectSession(id) {
    if (state.loading) { toast("请等待当前回答完成"); return; }
    state.currentId = id;
    localStorage.setItem("current_session", id);

    const s = state.sessions.find((x) => x.id === id);
    el.chatTitle.textContent = s ? s.title : "新对话";
    renderSessions();
    closeDrawer();

    clearThread();
    const loading = document.createElement("div");
    loading.className = "hist-loading";
    loading.textContent = "加载对话记录…";
    el.thread.appendChild(loading);

    try {
      const data = await api("/sessions/" + id + "/messages");
      renderHistory(data.messages);

      // 刷新页面后如果还有待审批的操作，把确认卡片补回来
      if (data.pending && data.pending.length) {
        const turn = document.createElement("div");
        turn.className = "turn";
        el.thread.appendChild(turn);
        showApproval(turn, { thread_id: id, actions: data.pending });
        scrollToBottom(true);
      }
    } catch (err) {
      clearThread();
      const p = document.createElement("div");
      p.className = "hist-loading err";
      p.textContent = "加载历史失败：" + err.message;
      el.thread.appendChild(p);
    }
  }

  /* ============ 新建会话 ============ */
  async function newChat() {
    if (state.loading) { toast("请等待当前回答完成"); return; }
    state.currentId = null;
    localStorage.removeItem("current_session");
    el.chatTitle.textContent = "新对话";
    renderSessions();
    showWelcome();
    closeDrawer();
    el.input.focus();
  }

  el.newChat.onclick = newChat;

  /* ============ 输入框 ============ */
  function autoGrow() {
    el.input.style.height = "auto";
    el.input.style.height = Math.min(el.input.scrollHeight, 180) + "px";
  }
  el.input.addEventListener("input", autoGrow);

  el.input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send();
    }
  });

  /* ============ 审批卡片 ============ */
  function approvalCard(actions) {
    const box = document.createElement("div");
    box.className = "approval";

    const head = document.createElement("div");
    head.className = "approval-head";
    head.textContent = "🔒 这是写操作，需要你确认后才会执行";
    box.appendChild(head);

    for (const action of actions) {
      const tool = document.createElement("div");
      tool.className = "approval-tool";
      tool.innerHTML = "即将调用 <code>" + escapeHtml(action.name || "工具") + "</code>";
      box.appendChild(tool);

      const args = document.createElement("div");
      args.className = "approval-args";
      for (const [k, v] of Object.entries(action.args || {})) {
        const line = document.createElement("div");
        line.innerHTML =
          '<span class="k">' + escapeHtml(k) + "</span>" +
          '<span class="v">' + escapeHtml(String(v)) + "</span>";
        args.appendChild(line);
      }
      box.appendChild(args);
    }

    const acts = document.createElement("div");
    acts.className = "approval-actions";

    const reject = document.createElement("button");
    reject.className = "reject";
    reject.textContent = "拒绝";

    const approve = document.createElement("button");
    approve.className = "approve";
    approve.textContent = "批准执行";

    acts.appendChild(reject);
    acts.appendChild(approve);
    box.appendChild(acts);

    return { box, acts, approve, reject };
  }

  /* ============ 单轮流式执行 ============ */
  async function runAgent(url, payload, turn, thinking) {
    let assistant = null;
    let answer = "";
    let finished = false;
    let interrupt = null;

    const dropThinking = () => {
      if (thinking && thinking.isConnected) thinking.remove();
    };

    const ensureAssistant = () => {
      if (assistant) return assistant;
      const row = document.createElement("div");
      row.className = "row";
      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = "🤖";
      const content = document.createElement("div");
      content.className = "content plain streaming";
      row.appendChild(avatar);
      row.appendChild(content);
      turn.appendChild(row);
      assistant = content;
      return content;
    };

    const handleFrame = (frame) => {
      if (!frame.trim() || finished) return;

      let type = "message";
      const dataLines = [];
      for (const line of frame.split(/\r?\n/)) {
        if (line.startsWith("event:")) type = line.slice(6).trim();
        else if (line.startsWith("data:")) dataLines.push(line.slice(5).trimStart());
      }
      if (!dataLines.length) return;

      let data;
      try { data = JSON.parse(dataLines.join("\n")); } catch (_) { return; }

      if (type === "status") {
        if (!answer && thinking && thinking.isConnected) {
          const label = thinking.querySelector("span:last-child");
          if (label) label.textContent = data.text || "正在分析问题…";
        }
      } else if (type === "tool") {
        dropThinking();
        const chipRow = document.createElement("div");
        chipRow.className = "tool-row";
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.innerHTML = "🔧 调用 <b>" + escapeHtml(data.name || "工具") + "</b>";
        chipRow.appendChild(chip);
        turn.appendChild(chipRow);

        if (data.text) {
          const box = document.createElement("details");
          box.className = "tool-res";
          const sum = document.createElement("summary");
          sum.textContent = "▸ 查看 " + (data.name || "工具") + " 返回内容";
          const pre = document.createElement("pre");
          pre.textContent = data.text;
          box.appendChild(sum);
          box.appendChild(pre);
          turn.appendChild(box);
        }
        scrollToBottom();
      } else if (type === "token") {
        dropThinking();
        if (typeof data.text === "string" && data.text) {
          answer += data.text;
          ensureAssistant().textContent = answer;
          scrollToBottom();
        }
      } else if (type === "interrupt") {
        finished = true;
        interrupt = data;
      } else if (type === "error") {
        throw new Error(data.message || "流式回答失败");
      } else if (type === "done") {
        finished = true;
      }
    };

    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });

    if (!res.ok) {
      let detail = "HTTP " + res.status;
      try {
        const body = await res.json();
        if (typeof body.detail === "string") detail = body.detail;
      } catch (_) {}
      throw new Error(detail);
    }
    if (!res.body) throw new Error("浏览器不支持流式读取");

    const reader = res.body.getReader();
    const decoder = new TextDecoder("utf-8");
    let buffer = "";

    try {
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let sep;
        while ((sep = /\r?\n\r?\n/.exec(buffer)) !== null) {
          const frame = buffer.slice(0, sep.index);
          buffer = buffer.slice(sep.index + sep[0].length);
          handleFrame(frame);
        }
      }
      buffer += decoder.decode();
      if (buffer.trim()) handleFrame(buffer);
    } finally {
      reader.releaseLock();
    }

    if (!finished) throw new Error("连接提前结束，未收到完成信号");

    dropThinking();

    if (assistant) {
      assistant.classList.remove("streaming", "plain");
      assistant.innerHTML = md(answer);
    } else if (!interrupt) {
      const box = ensureAssistant();
      box.classList.remove("streaming", "plain");
      box.textContent = "（没有返回文本内容）";
    }

    return { answer, interrupt };
  }

  /* ============ 审批交互 ============ */
  function showApproval(turn, interrupt) {
    const card = approvalCard(interrupt.actions || []);
    turn.appendChild(card.box);
    scrollToBottom();

    const decide = async (decision) => {
      card.approve.disabled = true;
      card.reject.disabled = true;

      const status = document.createElement("div");
      status.className = "approval-done " + (decision === "approve" ? "ok" : "no");
      status.textContent = decision === "approve" ? "✓ 已批准执行" : "✕ 已拒绝";
      card.acts.replaceWith(status);

      const thinking = document.createElement("div");
      thinking.className = "thinking";
      thinking.innerHTML =
        '<span class="dots"><i></i><i></i><i></i></span><span>' +
        (decision === "approve" ? "正在执行操作…" : "正在处理…") +
        "</span>";
      turn.appendChild(thinking);

      setLoading(true);
      state.stick = true;
      scrollToBottom();

      try {
        const r = await runAgent(
          "/chat/resume",
          {
            thread_id: interrupt.thread_id,
            decision,
            message: decision === "reject" ? "用户拒绝了本次操作" : undefined,
          },
          turn,
          thinking
        );

        // 一次审批通过后可能又触发下一次写操作，继续弹卡片
        if (r.interrupt) showApproval(turn, r.interrupt);

        try {
          await loadSessions();
          const cur = state.sessions.find((x) => x.id === state.currentId);
          if (cur) el.chatTitle.textContent = cur.title;
          renderSessions();
        } catch (_) {}

      } catch (err) {
        if (thinking.isConnected) thinking.remove();
        const box = document.createElement("div");
        box.className = "content err";
        box.textContent = "执行失败：" + err.message;
        const row = document.createElement("div");
        row.className = "row";
        row.appendChild(box);
        turn.appendChild(row);
        toast("执行失败：" + err.message);
      } finally {
        setLoading(false);
        scrollToBottom();
        el.input.focus();
      }
    };

    card.approve.onclick = () => decide("approve");
    card.reject.onclick = () => decide("reject");
  }

  /* ============ 发送消息 ============ */
  async function send() {
    const text = el.input.value.trim();
    if (!text || state.loading) return;

    el.input.value = "";
    autoGrow();
    setLoading(true);
    removeWelcome();

    try {
      if (!state.currentId) {
        const created = await api("/sessions", { method: "POST", body: "{}" });
        state.currentId = created.id;
        localStorage.setItem("current_session", created.id);
        state.sessions.unshift(created);
        renderSessions();
      }

      const sid = state.currentId;

      const turn = document.createElement("div");
      turn.className = "turn";
      el.thread.appendChild(turn);

      const userRow = document.createElement("div");
      userRow.className = "row user";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      userRow.appendChild(bubble);
      turn.appendChild(userRow);

      const thinking = document.createElement("div");
      thinking.className = "thinking";
      thinking.innerHTML =
        '<span class="dots"><i></i><i></i><i></i></span><span>正在分析问题…</span>';
      turn.appendChild(thinking);

      state.stick = true;
      scrollToBottom(true);

      const r = await runAgent(
        "/chat/stream",
        { thread_id: sid, message: text },
        turn,
        thinking
      );

      if (r.interrupt) showApproval(turn, r.interrupt);

      try {
        await loadSessions();
        const cur = state.sessions.find((x) => x.id === sid);
        if (cur) el.chatTitle.textContent = cur.title;
        renderSessions();
      } catch (_) {}

    } catch (err) {
      const box = document.createElement("div");
      box.className = "content err";
      box.textContent = "请求失败：" + err.message;
      const row = document.createElement("div");
      row.className = "row";
      row.appendChild(box);
      el.thread.appendChild(row);
      toast("请求失败：" + err.message);
    } finally {
      setLoading(false);
      scrollToBottom();
      el.input.focus();
    }
  }
  function setLoading(on) {
    state.loading = on;
    el.send.disabled = on;
    el.input.disabled = on;
    el.newChat.disabled = on;
    el.send.textContent = on ? "…" : "↑";
  }

  el.send.onclick = send;

  /* ============ 启动 ============ */
  (async function boot() {
    const storedTheme = localStorage.getItem("theme");
    const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    applyTheme(storedTheme || (prefersDark ? "dark" : "light"));

    try {
      await loadSessions();
    } catch (err) {
      toast("无法加载会话列表：" + err.message);
    }

    renderSessions();

    // 支持 ?s=<会话ID> 直接定位到某个会话
    const wanted = new URLSearchParams(location.search).get("s");
    const saved = wanted || localStorage.getItem("current_session");
    const target = state.sessions.find((s) => s.id === saved) || state.sessions[0];

    if (target) {
      await selectSession(target.id);
    } else {
      el.chatTitle.textContent = "新对话";
      showWelcome();
    }

    el.input.focus();
  })();
})();
</script>
</body>
