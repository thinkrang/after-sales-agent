<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Agent</title>
<style>
:root{
  --bg:#fff; --bg-soft:#fcfcfa;
  --side:#faf9f7; --side-hover:#f2f1ed; --side-active:#eae8e3;
  --border:#e8e6e0; --border-strong:#d7d4cc;
  --text:#1c1b19; --text-2:#57544e; --dim:#87837b; --faint:#b7b3aa;
  --accent:#4f46e5; --accent-hover:#4338ca; --accent-soft:#eef2ff;
  --user-bubble:#f4f3ef; --code-bg:#f7f6f3; --chip:#f4f3ef;
  --ok:#0d9488; --warn:#b45309; --err:#dc2626;
  --shadow-sm:0 1px 2px rgba(28,27,25,.04);
  --shadow-md:0 2px 8px rgba(28,27,25,.05),0 1px 2px rgba(28,27,25,.04);
  --shadow-lg:0 16px 48px rgba(28,27,25,.10),0 2px 8px rgba(28,27,25,.05);
  --ring:0 0 0 3px rgba(79,70,229,.14);
}
html[data-theme="dark"]{
  --bg:#131315; --bg-soft:#17171a;
  --side:#0e0e10; --side-hover:#1c1c20; --side-active:#26262d;
  --border:#26262b; --border-strong:#37373f;
  --text:#f0efec; --text-2:#bab7b1; --dim:#8c8981; --faint:#5e5c57;
  --accent:#8b85ff; --accent-hover:#a5a0ff; --accent-soft:#1e1b3a;
  --user-bubble:#22222a; --code-bg:#0b0b0d; --chip:#1e1e23;
  --ok:#2dd4bf; --warn:#fbbf24; --err:#f87171;
  --shadow-sm:none; --shadow-md:none;
  --shadow-lg:0 16px 48px rgba(0,0,0,.55);
  --ring:0 0 0 3px rgba(139,133,255,.18);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-size:15px;color:var(--text);background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI Variable","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overflow:hidden;text-rendering:optimizeLegibility;
}
button{font:inherit;color:inherit}
::selection{background:var(--accent-soft);color:var(--accent)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--faint);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 布局 ---------- */
.app{display:flex;height:100dvh;overflow:hidden}

/* ---------- 侧边栏 ---------- */
.sidebar{
  width:272px;flex:0 0 272px;background:var(--side);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;transition:margin-left .26s cubic-bezier(.32,.72,0,1);
}
.side-head{display:flex;align-items:center;gap:11px;padding:18px 16px 14px}
.brand-mark{
  width:32px;height:32px;flex:0 0 32px;border-radius:10px;
  background:linear-gradient(145deg,#6366f1,#4338ca);
  color:#fff;display:grid;place-items:center;
  box-shadow:0 2px 8px rgba(79,70,229,.28);
}
html[data-theme="dark"] .brand-mark{
  background:linear-gradient(145deg,#8b85ff,#5b52e0);
  box-shadow:0 2px 12px rgba(139,133,255,.24);
}
.brand-mark svg{width:17px;height:17px}
.brand-name{font-size:14.5px;font-weight:600;letter-spacing:-.012em;line-height:1.25}
.brand-sub{font-size:11px;color:var(--faint);margin-top:2px;letter-spacing:.01em}
.new-chat{
  margin:0 12px 10px;padding:10px 13px;display:flex;align-items:center;gap:8px;
  border:1px solid var(--border);background:var(--bg);border-radius:11px;
  font-size:13.5px;font-weight:500;cursor:pointer;
  box-shadow:var(--shadow-sm);
  transition:background .16s,border-color .16s,box-shadow .16s,transform .1s;
}
.new-chat:hover{background:var(--bg);border-color:var(--border-strong);box-shadow:var(--shadow-md)}
.new-chat:active{transform:scale(.985)}
.new-chat span{font-size:15px;color:var(--dim);line-height:1}
.sessions{flex:1;overflow-y:auto;padding:4px 10px 10px;overscroll-behavior:contain}
.group-label{
  font-size:11px;color:var(--faint);padding:12px 8px 6px;
  font-weight:600;letter-spacing:.04em;text-transform:uppercase;
}
.sess{
  position:relative;display:flex;align-items:center;gap:4px;
  padding:8px 10px;border-radius:9px;cursor:pointer;margin-bottom:1px;
  transition:background .13s;
}
.sess:hover{background:var(--side-hover)}
.sess.active{background:var(--side-active)}
.sess.active::before{
  content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:2.5px;height:16px;border-radius:2px;background:var(--accent);
}
.sess-title{
  flex:1;min-width:0;font-size:13.5px;line-height:1.45;color:var(--text-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.sess.active .sess-title{color:var(--text);font-weight:500}
.sess-acts{display:none;gap:1px;flex:0 0 auto}
.sess:hover .sess-acts,.sess.active .sess-acts{display:flex}
.act{
  width:22px;height:22px;display:grid;place-items:center;padding:0;
  border:0;background:transparent;border-radius:6px;color:var(--dim);
  cursor:pointer;font-size:12px;line-height:1;
  transition:background .13s,color .13s;
}
.act:hover{background:var(--bg);color:var(--text)}
.act.danger:hover{color:var(--err)}
input.rename{
  flex:1;min-width:0;font:inherit;font-size:13.5px;color:var(--text);
  background:var(--bg);border:1px solid var(--accent);border-radius:7px;
  padding:3px 7px;outline:none;box-shadow:var(--ring);
}
.sessions-empty{padding:20px 12px;font-size:12.5px;color:var(--faint);text-align:center;line-height:1.8}
.side-foot{
  border-top:1px solid var(--border);padding:10px 12px;
  display:flex;flex-direction:column;gap:2px;
}
.foot-link{
  display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;
  border:0;background:transparent;border-radius:9px;text-decoration:none;
  font-size:13.5px;color:var(--text-2);cursor:pointer;
  transition:background .13s,color .13s;
}
.foot-link:hover{background:var(--side-hover);color:var(--text)}

/* ---------- 主区域 ---------- */
.chat{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.chat-top{
  height:60px;flex:0 0 60px;display:flex;align-items:center;gap:10px;
  padding:0 20px;border-bottom:1px solid var(--border);
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:saturate(1.6) blur(12px);
  position:relative;z-index:5;
}
.chat-title{
  flex:1;min-width:0;font-size:14.5px;font-weight:600;letter-spacing:-.008em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.icon-btn{
  width:34px;height:34px;flex:0 0 34px;display:grid;place-items:center;padding:0;
  border:0;background:transparent;border-radius:9px;color:var(--dim);
  cursor:pointer;font-size:16px;transition:background .13s,color .13s;
}
.icon-btn:hover{background:var(--side-hover);color:var(--text)}
.menu-btn{display:none}
.pill{
  font-size:11.5px;color:var(--dim);border:1px solid var(--border);
  border-radius:999px;padding:4px 10px;white-space:nowrap;
  background:var(--bg-soft);font-weight:500;letter-spacing:.01em;
}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;scroll-behavior:smooth}
.thread{max-width:760px;margin:0 auto;padding:32px 24px 44px;display:flex;flex-direction:column;gap:22px;min-height:100%}

/* ---------- 消息 ---------- */
.turn{display:flex;flex-direction:column;gap:13px}
.row{display:flex;gap:13px;align-items:flex-start}
.row.user{justify-content:flex-end}
.bubble{
  max-width:min(78%,600px);background:var(--user-bubble);padding:11px 16px;
  border-radius:18px;border-bottom-right-radius:6px;line-height:1.68;
  font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere;
  border:1px solid var(--border);
}
.avatar{
  width:30px;height:30px;flex:0 0 30px;border-radius:9px;
  background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;margin-top:1px;
  border:1px solid color-mix(in srgb,var(--accent) 16%,transparent);
}
.avatar svg{width:16px;height:16px}
.content{flex:1;min-width:0;font-size:15px;line-height:1.76;overflow-wrap:anywhere;color:var(--text)}
.content.plain{white-space:pre-wrap}
.content.streaming::after{
  content:"";display:inline-block;width:2px;height:1em;margin-left:3px;
  background:var(--accent);border-radius:1px;vertical-align:-2px;
  animation:blink 1s steps(1) infinite;
}
@keyframes blink{50%{opacity:0}}
.content p{margin:0 0 11px}
.content p:last-child{margin-bottom:0}
.content h3{margin:18px 0 9px;font-size:15.5px;font-weight:600;letter-spacing:-.008em}
.content h4{margin:15px 0 7px;font-size:14.5px;font-weight:600}
.content ul,.content ol{margin:0 0 11px;padding-left:21px}
.content li{margin:4px 0}
.content li::marker{color:var(--faint)}
.content code{
  background:var(--code-bg);padding:2px 6px;border-radius:5px;
  font-size:12.8px;font-family:ui-monospace,"SF Mono",Consolas,monospace;
  border:1px solid var(--border);
}
.content pre.code{
  background:var(--code-bg);padding:14px 16px;border-radius:12px;
  overflow-x:auto;margin:0 0 11px;border:1px solid var(--border);
}
.content pre.code code{background:none;padding:0;border:0;font-size:12.8px;line-height:1.65}
.content strong{font-weight:600}
.content a{color:var(--accent);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.content a:hover{border-bottom-color:var(--accent)}
.content blockquote{
  margin:0 0 11px;padding:2px 0 2px 14px;
  border-left:2px solid var(--border-strong);color:var(--text-2);
}

/* 工具调用 */
.tool-row{display:flex;align-items:center;gap:7px;padding-left:43px}
.chip{
  display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--dim);
  background:var(--chip);border:1px solid var(--border);border-radius:999px;padding:5px 12px;
  transition:border-color .15s,color .15s;
}
.chip::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--ok);flex:0 0 5px}
.chip b{font-weight:500;color:var(--text-2)}
details.tool-res{padding-left:43px;font-size:12.5px}
details.tool-res summary{
  cursor:pointer;color:var(--dim);list-style:none;
  display:inline-flex;align-items:center;gap:5px;padding:2px 0;
  transition:color .13s;
}
details.tool-res summary::-webkit-details-marker{display:none}
details.tool-res summary:hover{color:var(--text-2)}
details.tool-res pre{
  white-space:pre-wrap;overflow-wrap:anywhere;background:var(--code-bg);
  padding:12px 14px;border-radius:10px;margin:7px 0 0;font-size:12.3px;
  line-height:1.65;max-height:280px;overflow:auto;
  border:1px solid var(--border);color:var(--text-2);
  font-family:ui-monospace,"SF Mono",Consolas,monospace;
}
.thinking{display:flex;align-items:center;gap:9px;padding-left:43px;color:var(--dim);font-size:13px}
.dots{display:inline-flex;gap:4px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--faint);animation:bounce 1.3s infinite}
.dots i:nth-child(2){animation-delay:.16s}
.dots i:nth-child(3){animation-delay:.32s}
@keyframes bounce{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.err{color:var(--err);font-size:13.5px}

/* ---------- 审批卡片 ---------- */
.approval{
  margin-left:43px;max-width:520px;padding:16px 18px 15px;
  border:1px solid var(--border);border-left:3px solid var(--accent);
  border-radius:13px;background:var(--bg-soft);
  box-shadow:var(--shadow-md);
}
.approval-head{
  font-size:12px;color:var(--accent);font-weight:600;margin-bottom:11px;
  display:flex;align-items:center;gap:6px;letter-spacing:.02em;
}
.approval-head::before{
  content:"";width:13px;height:13px;flex:0 0 13px;
  background:currentColor;
  -webkit-mask:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.2' stroke-linecap='round'%3E%3Crect x='4' y='10.5' width='16' height='10' rx='2.2'/%3E%3Cpath d='M8 10.5V7a4 4 0 0 1 8 0v3.5'/%3E%3C/svg%3E") center/contain no-repeat;
  mask:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.2' stroke-linecap='round'%3E%3Crect x='4' y='10.5' width='16' height='10' rx='2.2'/%3E%3Cpath d='M8 10.5V7a4 4 0 0 1 8 0v3.5'/%3E%3C/svg%3E") center/contain no-repeat;
}
.approval-tool{font-size:13.5px;font-weight:500;margin-bottom:10px;color:var(--text)}
.approval-tool code{
  background:var(--code-bg);padding:2px 7px;border-radius:6px;
  font-size:12.5px;border:1px solid var(--border);
  font-family:ui-monospace,"SF Mono",Consolas,monospace;color:var(--accent);
}
.approval-args{display:flex;flex-direction:column;gap:6px;font-size:12.5px;margin-bottom:15px}
.approval-args>div{display:flex;align-items:baseline;gap:8px}
.approval-args .k{
  color:var(--dim);min-width:64px;flex:0 0 auto;
  font-size:11.5px;letter-spacing:.02em;
}
.approval-args .v{
  font-family:ui-monospace,"SF Mono",Consolas,monospace;
  color:var(--text);background:var(--bg);padding:2px 7px;border-radius:5px;
  border:1px solid var(--border);
}
.approval-actions{display:flex;gap:8px;justify-content:flex-end}
.approval-actions button{
  padding:8px 17px;border-radius:9px;font-size:13px;font-weight:500;cursor:pointer;
  border:1px solid var(--border-strong);background:var(--bg);
  transition:background .14s,border-color .14s,transform .1s,box-shadow .14s;
}
.approval-actions button:active{transform:scale(.98)}
.approval-actions .reject{color:var(--text-2)}
.approval-actions .reject:hover{background:var(--side-hover);color:var(--text)}
.approval-actions .approve{
  background:var(--accent);color:#fff;border-color:var(--accent);
  box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 28%,transparent);
}
.approval-actions .approve:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.approval-actions button:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.approval-done{
  display:flex;align-items:center;gap:6px;font-size:12.5px;
  color:var(--dim);font-weight:500;
}
.approval-done.ok{color:var(--ok)}
.approval-done.no{color:var(--warn)}

/* ---------- 欢迎页 ---------- */
.welcome{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  flex:1;text-align:center;padding:56px 24px;
}
.welcome-mark{
  width:60px;height:60px;border-radius:18px;
  background:linear-gradient(145deg,#6366f1,#4338ca);
  color:#fff;display:grid;place-items:center;margin-bottom:22px;
  box-shadow:0 8px 28px rgba(79,70,229,.26),0 2px 6px rgba(79,70,229,.2);
}
html[data-theme="dark"] .welcome-mark{
  background:linear-gradient(145deg,#8b85ff,#5b52e0);
  box-shadow:0 8px 32px rgba(139,133,255,.22);
}
.welcome-mark svg{width:29px;height:29px}
.welcome h2{
  margin:0 0 9px;font-size:23px;font-weight:600;letter-spacing:-.022em;
  line-height:1.3;
}
.welcome p{margin:0;color:var(--dim);font-size:13.5px;line-height:1.7;max-width:420px}
.sugs{
  display:flex;flex-wrap:wrap;justify-content:center;
  gap:10px;margin-top:30px;max-width:560px;width:100%;
}
.sug{
  border:1px solid var(--border);background:var(--bg);border-radius:12px;
  flex:0 1 auto;max-width:100%;
  padding:11px 16px;font-size:13px;cursor:pointer;text-align:left;
  line-height:1.5;color:var(--text-2);
  box-shadow:var(--shadow-sm);
  transition:background .15s,border-color .15s,box-shadow .15s,transform .1s,color .15s;
}
.sug:hover{
  background:var(--bg);border-color:var(--border-strong);
  box-shadow:var(--shadow-md);color:var(--text);transform:translateY(-1px);
}
.sug:active{transform:translateY(0)}
.hist-loading{padding:48px;text-align:center;color:var(--faint);font-size:13px}
.hist-loading.err{color:var(--err)}

/* ---------- 输入区 ---------- */
.composer{padding:0 24px 20px;background:var(--bg)}
.composer-inner{
  max-width:760px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;
  border:1px solid var(--border-strong);border-radius:18px;
  padding:8px 8px 8px 16px;background:var(--bg);
  box-shadow:var(--shadow-md);
  transition:border-color .18s,box-shadow .18s;
}
.composer-inner:focus-within{
  border-color:var(--accent);box-shadow:var(--ring),var(--shadow-md);
}
#input{
  flex:1;min-width:0;border:0;outline:none;resize:none;background:transparent;
  color:var(--text);font:inherit;font-size:14.5px;line-height:1.6;
  padding:7px 0;max-height:190px;
}
#input::placeholder{color:var(--faint)}
.send-btn{
  width:36px;height:36px;flex:0 0 36px;display:grid;place-items:center;
  border:0;border-radius:11px;background:var(--accent);color:#fff;
  font-size:16px;cursor:pointer;
  box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 30%,transparent);
  transition:opacity .15s,transform .1s,background .15s;
}
.send-btn:hover:not(:disabled){background:var(--accent-hover)}
.send-btn:active:not(:disabled){transform:scale(.94)}
.send-btn:disabled{opacity:.3;cursor:not-allowed;box-shadow:none}
.hint{
  max-width:760px;margin:9px auto 0;text-align:center;
  font-size:11.5px;color:var(--faint);line-height:1.5;
}

/* ---------- 提示条 ---------- */
.toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,14px);
  background:var(--text);color:var(--bg);font-size:13px;padding:10px 18px;
  border-radius:11px;opacity:0;pointer-events:none;z-index:60;
  box-shadow:var(--shadow-lg);font-weight:500;
  transition:opacity .24s,transform .24s cubic-bezier(.32,.72,0,1);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- 移动端 ---------- */
.backdrop{display:none;position:fixed;inset:0;background:rgba(20,20,18,.4);z-index:20;backdrop-filter:blur(2px)}
@media (max-width:820px){
  .sidebar{
    position:fixed;top:0;bottom:0;left:0;z-index:30;margin-left:-272px;
    box-shadow:0 0 60px rgba(0,0,0,.22);
  }
  .sidebar.open{margin-left:0}
  .backdrop.show{display:block}
  .menu-btn{display:grid}
  .chat-top{height:56px;flex:0 0 56px;padding:0 14px}
  .thread{padding:20px 15px 32px;gap:18px}
  .bubble{max-width:86%}
  .composer{padding:0 13px 13px}
  .tool-row,details.tool-res,.thinking{padding-left:0}
  .approval{margin-left:0;max-width:100%}
  .sugs{max-width:100%}
  .welcome{padding:40px 20px}
  .welcome h2{font-size:20px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 11.6a8.4 8.4 0 0 1-9 8.4 8.6 8.6 0 0 1-3.5-.9L3.5 20.5l1.4-4.4a8.4 8.4 0 0 1-.9-3.8 8.4 8.4 0 0 1 8.4-8.4 8.4 8.4 0 0 1 8.1 7.7z"/><circle cx="9.2" cy="11.4" r="1.05" fill="currentColor" stroke="none"/><circle cx="12.4" cy="11.4" r="1.05" fill="currentColor" stroke="none"/><circle cx="15.6" cy="11.4" r="1.05" fill="currentColor" stroke="none"/></svg></div>
      <div>
        <div class="brand-name">Mini Agent</div>
        <div class="brand-sub">LangChain · RAG · DeepSeek</div>
      </div>
    </div>

    <button class="new-chat" id="newChat"><span>＋</span> 新对话</button>

    <div class="sessions" id="sessionList"></div>

    <div class="side-foot">
      <a class="foot-link" href="/knowledge"><span>📚</span> 知识库管理</a>
      <button class="foot-link" id="themeToggle"><span id="themeIcon">🌙</span> <span id="themeText">深色模式</span></button>
    </div>
  </aside>

  <div class="backdrop" id="backdrop"></div>

  <main class="chat">
    <header class="chat-top">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="打开侧边栏">☰</button>
      <div class="chat-title" id="chatTitle">新对话</div>
      <span class="pill">DeepSeek</span>
    </header>

    <div class="scroll" id="scroll">
      <div class="thread" id="thread"></div>
    </div>

    <div class="composer">
      <div class="composer-inner">
        <textarea id="input" rows="1" placeholder="给 Mini Agent 发送消息…"></textarea>
        <button class="send-btn" id="send" aria-label="发送">↑</button>
      </div>
      <div class="hint">Enter 发送 · Shift + Enter 换行 · 回答由 DeepSeek 生成</div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  // 助手头像用的 SVG 标记。用内联 SVG 而不是 emoji：
  // emoji 在不同系统渲染差异极大（Windows 是彩色、macOS 是苹果风），
  // 而且和品牌图标无法保持一致。
  const AGENT_MARK =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M20.5 11.6a8.4 8.4 0 0 1-9 8.4 8.6 8.6 0 0 1-3.5-.9L3.5 20.5l1.4-4.4' +
    'a8.4 8.4 0 0 1-.9-3.8 8.4 8.4 0 0 1 8.4-8.4 8.4 8.4 0 0 1 8.1 7.7z"/>' +
    '<circle cx="9.2" cy="11.4" r="1.05" fill="currentColor" stroke="none"/>' +
    '<circle cx="12.4" cy="11.4" r="1.05" fill="currentColor" stroke="none"/>' +
    '<circle cx="15.6" cy="11.4" r="1.05" fill="currentColor" stroke="none"/></svg>';

  /* ============ 元素与状态 ============ */
  const el = {
    sidebar: document.getElementById("sidebar"),
    backdrop: document.getElementById("backdrop"),
    menuBtn: document.getElementById("menuBtn"),
    sessionList: document.getElementById("sessionList"),
    newChat: document.getElementById("newChat"),
    chatTitle: document.getElementById("chatTitle"),
    scroll: document.getElementById("scroll"),
    thread: document.getElementById("thread"),
    input: document.getElementById("input"),
    send: document.getElementById("send"),
    themeToggle: document.getElementById("themeToggle"),
    themeIcon: document.getElementById("themeIcon"),
    themeText: document.getElementById("themeText"),
    toast: document.getElementById("toast"),
  };

  const state = {
    sessions: [],
    currentId: null,
    loading: false,
    stick: true,
  };

  const SUGGESTIONS = [
    "你们的退货政策是什么？",
    "付款后多久发货？",
    "买 3 个单价 99.9 的商品一共多少钱？",
  ];

  /* ============ 通用工具 ============ */
  function toast(msg) {
    el.toast.textContent = msg;
    el.toast.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.toast.classList.remove("show"), 2600);
  }

  async function api(path, opts) {
    const options = Object.assign({ headers: { "Content-Type": "application/json" } }, opts || {});
    const res = await fetch(path, options);
    if (!res.ok) {
      let msg = "HTTP " + res.status;
      try {
        const body = await res.json();
        if (typeof body.detail === "string") msg = body.detail;
      } catch (_) {}
      throw new Error(msg);
    }
    if (res.status === 204) return null;
    return res.json();
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  /* ============ 轻量 Markdown ============ */
  function md(src) {
    const blocks = [];
    let s = escapeHtml(src);

    s = s.replace(/```[a-zA-Z0-9]*\n?([\s\S]*?)```/g, (m, code) => {
      blocks.push('<pre class="code"><code>' + code.replace(/\n$/, "") + "</code></pre>");
      return "\u0000B" + (blocks.length - 1) + "\u0000";
    });

    s = s.replace(/`([^`\n]+)`/g, "<code>$1</code>");
    s = s.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/^#{1,6}\s+(.+)$/gm, "<h4>$1</h4>");

    s = s.replace(/(?:^|\n)((?:[-*]\s+.+(?:\n|$))+)/g, (m, body) => {
      const items = body.trim().split("\n")
        .map((line) => "<li>" + line.replace(/^[-*]\s+/, "") + "</li>")
        .join("");
      return "\n<ul>" + items + "</ul>\n";
    });

    s = s.split(/\n{2,}/).map((p) => {
      const t = p.trim();
      if (!t) return "";
      if (/^<(h4|ul|pre)/.test(t) || /^\u0000B/.test(t)) return t;
      return "<p>" + t.replace(/\n/g, "<br>") + "</p>";
    }).join("");

    return s.replace(/\u0000B(\d+)\u0000/g, (m, i) => blocks[+i]);
  }

  /* ============ 滚动 ============ */
  el.scroll.addEventListener("scroll", () => {
    const gap = el.scroll.scrollHeight - el.scroll.scrollTop - el.scroll.clientHeight;
    state.stick = gap < 90;
  });

  function scrollToBottom(force) {
    if (!force && !state.stick) return;
    el.scroll.scrollTop = el.scroll.scrollHeight;
  }

  /* ============ 主题 ============ */
  function applyTheme(theme, persist = true) {
    document.documentElement.dataset.theme = theme;
    const dark = theme === "dark";
    el.themeIcon.textContent = dark ? "☀️" : "🌙";
    el.themeText.textContent = dark ? "浅色模式" : "深色模式";
    // URL 指定的主题不写入本地，避免一次性预览覆盖用户长期偏好
    if (persist) localStorage.setItem("theme", theme);
  }

  el.themeToggle.onclick = () => {
    applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
  };

  /* ============ 侧边栏抽屉 ============ */
  function openDrawer() {
    el.sidebar.classList.add("open");
    el.backdrop.classList.add("show");
  }
  function closeDrawer() {
    el.sidebar.classList.remove("open");
    el.backdrop.classList.remove("show");
  }
  el.menuBtn.onclick = openDrawer;
  el.backdrop.onclick = closeDrawer;

  /* ============ 会话列表 ============ */
  function groupOf(ts) {
    const d = new Date(ts.replace(" ", "T"));
    if (isNaN(d)) return "更早";
    const startOf = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
    const days = Math.round((startOf(new Date()) - startOf(d)) / 86400000);
    if (days <= 0) return "今天";
    if (days === 1) return "昨天";
    if (days < 7) return "7 天内";
    return "更早";
  }

  async function loadSessions() {
    const data = await api("/sessions");
    state.sessions = data.sessions || [];
  }

  function sessionEl(s) {
    const row = document.createElement("div");
    row.className = "sess" + (s.id === state.currentId ? " active" : "");
    row.dataset.id = s.id;

    const title = document.createElement("div");
    title.className = "sess-title";
    title.textContent = s.title;

    const acts = document.createElement("div");
    acts.className = "sess-acts";

    const btnRename = document.createElement("button");
    btnRename.className = "act";
    btnRename.textContent = "✎";
    btnRename.title = "重命名";
    btnRename.onclick = (e) => { e.stopPropagation(); startRename(row, title, s); };

    const btnDel = document.createElement("button");
    btnDel.className = "act danger";
    btnDel.textContent = "🗑";
    btnDel.title = "删除";
    btnDel.onclick = (e) => { e.stopPropagation(); removeSession(s); };

    acts.appendChild(btnRename);
    acts.appendChild(btnDel);
    row.appendChild(title);
    row.appendChild(acts);
    row.onclick = () => selectSession(s.id);

    return row;
  }

  function renderSessions() {
    el.sessionList.innerHTML = "";
    if (!state.sessions.length) {
      const empty = document.createElement("div");
      empty.className = "sessions-empty";
      empty.textContent = "还没有会话，发一条消息就会自动创建";
      el.sessionList.appendChild(empty);
      return;
    }

    const groups = new Map();
    for (const s of state.sessions) {
      const g = groupOf(s.updated_at);
      if (!groups.has(g)) groups.set(g, []);
      groups.get(g).push(s);
    }

    for (const [label, items] of groups) {
      const h = document.createElement("div");
      h.className = "group-label";
      h.textContent = label;
      el.sessionList.appendChild(h);
      items.forEach((s) => el.sessionList.appendChild(sessionEl(s)));
    }
  }

  function startRename(row, titleEl, s) {
    if (row.querySelector("input.rename")) return;
    const input = document.createElement("input");
    input.className = "rename";
    input.value = s.title;
    input.maxLength = 40;
    titleEl.replaceWith(input);
    input.focus();
    input.select();

    let done = false;
    const finish = async (save) => {
      if (done) return;
      done = true;
      const value = input.value.trim();
      if (save && value && value !== s.title) {
        try {
          await api("/sessions/" + s.id, {
            method: "PATCH",
            body: JSON.stringify({ title: value }),
          });
          s.title = value;
          if (state.currentId === s.id) el.chatTitle.textContent = value;
        } catch (err) {
          toast("重命名失败：" + err.message);
        }
      }
      input.replaceWith(titleEl);
      titleEl.textContent = s.title;
    };

    input.onkeydown = (e) => {
      if (e.key === "Enter") { e.preventDefault(); finish(true); }
      else if (e.key === "Escape") { e.preventDefault(); finish(false); }
    };
    input.onblur = () => finish(true);
  }

  async function removeSession(s) {
    if (state.loading) { toast("请等待当前回答完成"); return; }
    if (!confirm('删除会话「' + s.title + '」？\n该会话的对话记录会一并删除，无法恢复。')) return;

    try {
      await api("/sessions/" + s.id, { method: "DELETE" });
      state.sessions = state.sessions.filter((x) => x.id !== s.id);

      if (state.currentId === s.id) {
        if (state.sessions.length) {
          await selectSession(state.sessions[0].id);
        } else {
          state.currentId = null;
          el.chatTitle.textContent = "新对话";
          renderSessions();
          showWelcome();
        }
      } else {
        renderSessions();
      }
      toast("会话已删除");
    } catch (err) {
      toast("删除失败：" + err.message);
    }
  }

  /* ============ 消息渲染 ============ */
  function clearThread() {
    el.thread.innerHTML = "";
  }

  function showWelcome() {
    clearThread();
    const wrap = document.createElement("div");
    wrap.className = "welcome";
    wrap.innerHTML =
      '<div class="welcome-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 11.6a8.4 8.4 0 0 1-9 8.4 8.6 8.6 0 0 1-3.5-.9L3.5 20.5l1.4-4.4a8.4 8.4 0 0 1-.9-3.8 8.4 8.4 0 0 1 8.4-8.4 8.4 8.4 0 0 1 8.1 7.7z"/><circle cx="9.2" cy="11.4" r="1.05" fill="currentColor" stroke="none"/><circle cx="12.4" cy="11.4" r="1.05" fill="currentColor" stroke="none"/><circle cx="15.6" cy="11.4" r="1.05" fill="currentColor" stroke="none"/></svg></div>' +
      "<h2>有什么可以帮你？</h2>" +
      "<p>我可以查询店铺知识库、计算订单金额</p>";

    const sugs = document.createElement("div");
    sugs.className = "sugs";
    SUGGESTIONS.forEach((text) => {
      const b = document.createElement("button");
      b.className = "sug";
      b.textContent = text;
      b.onclick = () => {
        el.input.value = text;
        autoGrow();
        send();
      };
      sugs.appendChild(b);
    });

    wrap.appendChild(sugs);
    el.thread.appendChild(wrap);
    state.stick = true;
  }

  function removeWelcome() {
    const w = el.thread.querySelector(".welcome");
    if (w) w.remove();
  }

  function rowUser(text) {
    const row = document.createElement("div");
    row.className = "row user";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    row.appendChild(bubble);
    el.thread.appendChild(row);
    return row;
  }

  function rowToolCall(name) {
    const row = document.createElement("div");
    row.className = "tool-row";
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.innerHTML = "🔧 调用 <b>" + escapeHtml(name || "工具") + "</b>";
    row.appendChild(chip);
    el.thread.appendChild(row);
    return row;
  }

  function rowToolResult(name, text) {
    const box = document.createElement("details");
    box.className = "tool-res";
    const sum = document.createElement("summary");
    sum.textContent = "▸ " + (name || "工具") + " 返回结果";
    const pre = document.createElement("pre");
    pre.textContent = text;
    box.appendChild(sum);
    box.appendChild(pre);
    el.thread.appendChild(box);
    return box;
  }

  function createAssistantRow() {
    const row = document.createElement("div");
    row.className = "row";
    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.innerHTML = AGENT_MARK;
    const content = document.createElement("div");
    content.className = "content plain";
    row.appendChild(avatar);
    row.appendChild(content);
    el.thread.appendChild(row);
    return content;
  }

  function renderHistory(messages) {
    clearThread();
    if (!messages || !messages.length) {
      showWelcome();
      return;
    }

    let turn = null;
    let content = null;

    for (const m of messages) {
      if (m.role === "user") {
        turn = document.createElement("div");
        turn.className = "turn";
        el.thread.appendChild(turn);
        const row = document.createElement("div");
        row.className = "row user";
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = m.text;
        row.appendChild(bubble);
        turn.appendChild(row);
        content = null;
      } else if (m.role === "tool_call") {
        if (!turn) {
          turn = document.createElement("div");
          turn.className = "turn";
          el.thread.appendChild(turn);
        }
        const row = document.createElement("div");
        row.className = "tool-row";
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.innerHTML = "🔧 调用 <b>" + escapeHtml(m.name || "工具") + "</b>";
        row.appendChild(chip);
        turn.appendChild(row);
      } else if (m.role === "tool_result") {
        if (!turn) {
          turn = document.createElement("div");
          turn.className = "turn";
          el.thread.appendChild(turn);
        }
        const box = document.createElement("details");
        box.className = "tool-res";
        const sum = document.createElement("summary");
        sum.textContent = "▸ " + (m.name || "工具") + " 返回结果";
        const pre = document.createElement("pre");
        pre.textContent = m.text;
        box.appendChild(sum);
        box.appendChild(pre);
        turn.appendChild(box);
      } else if (m.role === "assistant") {
        if (!turn) {
          turn = document.createElement("div");
          turn.className = "turn";
          el.thread.appendChild(turn);
        }
        const row = document.createElement("div");
        row.className = "row";
        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.innerHTML = AGENT_MARK;
        const box = document.createElement("div");
        box.className = "content";
        box.innerHTML = md(m.text);
        row.appendChild(avatar);
        row.appendChild(box);
        turn.appendChild(row);
      }
    }

    state.stick = true;
    scrollToBottom(true);
  }

  /* ============ 切换会话 ============ */
  async function selectSession(id) {
    if (state.loading) { toast("请等待当前回答完成"); return; }
    state.currentId = id;
    localStorage.setItem("current_session", id);

    const s = state.sessions.find((x) => x.id === id);
    el.chatTitle.textContent = s ? s.title : "新对话";
    renderSessions();
    closeDrawer();

    clearThread();
    const loading = document.createElement("div");
    loading.className = "hist-loading";
    loading.textContent = "加载对话记录…";
    el.thread.appendChild(loading);

    try {
      const data = await api("/sessions/" + id + "/messages");
      renderHistory(data.messages);

      // 刷新页面后如果还有待审批的操作，把确认卡片补回来
      if (data.pending && data.pending.length) {
        const turn = document.createElement("div");
        turn.className = "turn";
        el.thread.appendChild(turn);
        showApproval(turn, { thread_id: id, actions: data.pending });
        scrollToBottom(true);
      }
    } catch (err) {
      clearThread();
      const p = document.createElement("div");
      p.className = "hist-loading err";
      p.textContent = "加载历史失败：" + err.message;
      el.thread.appendChild(p);
    }
  }

  /* ============ 新建会话 ============ */
  async function newChat() {
    if (state.loading) { toast("请等待当前回答完成"); return; }
    state.currentId = null;
    localStorage.removeItem("current_session");
    el.chatTitle.textContent = "新对话";
    renderSessions();
    showWelcome();
    closeDrawer();
    el.input.focus();
  }

  el.newChat.onclick = newChat;

  /* ============ 输入框 ============ */
  function autoGrow() {
    el.input.style.height = "auto";
    el.input.style.height = Math.min(el.input.scrollHeight, 180) + "px";
  }
  el.input.addEventListener("input", autoGrow);

  el.input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send();
    }
  });

  /* ============ 审批卡片 ============ */
  function approvalCard(actions) {
    const box = document.createElement("div");
    box.className = "approval";

    const head = document.createElement("div");
    head.className = "approval-head";
    head.textContent = "🔒 这是写操作，需要你确认后才会执行";
    box.appendChild(head);

    for (const action of actions) {
      const tool = document.createElement("div");
      tool.className = "approval-tool";
      tool.innerHTML = "即将调用 <code>" + escapeHtml(action.name || "工具") + "</code>";
      box.appendChild(tool);

      const args = document.createElement("div");
      args.className = "approval-args";
      for (const [k, v] of Object.entries(action.args || {})) {
        const line = document.createElement("div");
        line.innerHTML =
          '<span class="k">' + escapeHtml(k) + "</span>" +
          '<span class="v">' + escapeHtml(String(v)) + "</span>";
        args.appendChild(line);
      }
      box.appendChild(args);
    }

    const acts = document.createElement("div");
    acts.className = "approval-actions";

    const reject = document.createElement("button");
    reject.className = "reject";
    reject.textContent = "拒绝";

    const approve = document.createElement("button");
    approve.className = "approve";
    approve.textContent = "批准执行";

    acts.appendChild(reject);
    acts.appendChild(approve);
    box.appendChild(acts);

    return { box, acts, approve, reject };
  }

  /* ============ 单轮流式执行 ============ */
  async function runAgent(url, payload, turn, thinking) {
    let assistant = null;
    let answer = "";
    let finished = false;
    let interrupt = null;

    const dropThinking = () => {
      if (thinking && thinking.isConnected) thinking.remove();
    };

    const ensureAssistant = () => {
      if (assistant) return assistant;
      const row = document.createElement("div");
      row.className = "row";
      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.innerHTML = AGENT_MARK;
      const content = document.createElement("div");
      content.className = "content plain streaming";
      row.appendChild(avatar);
      row.appendChild(content);
      turn.appendChild(row);
      assistant = content;
      return content;
    };

    const handleFrame = (frame) => {
      if (!frame.trim() || finished) return;

      let type = "message";
      const dataLines = [];
      for (const line of frame.split(/\r?\n/)) {
        if (line.startsWith("event:")) type = line.slice(6).trim();
        else if (line.startsWith("data:")) dataLines.push(line.slice(5).trimStart());
      }
      if (!dataLines.length) return;

      let data;
      try { data = JSON.parse(dataLines.join("\n")); } catch (_) { return; }

      if (type === "status") {
        if (!answer && thinking && thinking.isConnected) {
          const label = thinking.querySelector("span:last-child");
          if (label) label.textContent = data.text || "正在分析问题…";
        }
      } else if (type === "tool") {
        dropThinking();
        const chipRow = document.createElement("div");
        chipRow.className = "tool-row";
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.innerHTML = "🔧 调用 <b>" + escapeHtml(data.name || "工具") + "</b>";
        chipRow.appendChild(chip);
        turn.appendChild(chipRow);

        if (data.text) {
          const box = document.createElement("details");
          box.className = "tool-res";
          const sum = document.createElement("summary");
          sum.textContent = "▸ 查看 " + (data.name || "工具") + " 返回内容";
          const pre = document.createElement("pre");
          pre.textContent = data.text;
          box.appendChild(sum);
          box.appendChild(pre);
          turn.appendChild(box);
        }
        scrollToBottom();
      } else if (type === "token") {
        dropThinking();
        if (typeof data.text === "string" && data.text) {
          answer += data.text;
          ensureAssistant().textContent = answer;
          scrollToBottom();
        }
      } else if (type === "interrupt") {
        finished = true;
        interrupt = data;
      } else if (type === "error") {
        throw new Error(data.message || "流式回答失败");
      } else if (type === "done") {
        finished = true;
      }
    };

    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });

    if (!res.ok) {
      let detail = "HTTP " + res.status;
      try {
        const body = await res.json();
        if (typeof body.detail === "string") detail = body.detail;
      } catch (_) {}
      throw new Error(detail);
    }
    if (!res.body) throw new Error("浏览器不支持流式读取");

    const reader = res.body.getReader();
    const decoder = new TextDecoder("utf-8");
    let buffer = "";

    try {
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let sep;
        while ((sep = /\r?\n\r?\n/.exec(buffer)) !== null) {
          const frame = buffer.slice(0, sep.index);
          buffer = buffer.slice(sep.index + sep[0].length);
          handleFrame(frame);
        }
      }
      buffer += decoder.decode();
      if (buffer.trim()) handleFrame(buffer);
    } finally {
      reader.releaseLock();
    }

    if (!finished) throw new Error("连接提前结束，未收到完成信号");

    dropThinking();

    if (assistant) {
      assistant.classList.remove("streaming", "plain");
      assistant.innerHTML = md(answer);
    } else if (!interrupt) {
      const box = ensureAssistant();
      box.classList.remove("streaming", "plain");
      box.textContent = "（没有返回文本内容）";
    }

    return { answer, interrupt };
  }

  /* ============ 审批交互 ============ */
  function showApproval(turn, interrupt) {
    const card = approvalCard(interrupt.actions || []);
    turn.appendChild(card.box);
    scrollToBottom();

    const decide = async (decision) => {
      card.approve.disabled = true;
      card.reject.disabled = true;

      const status = document.createElement("div");
      status.className = "approval-done " + (decision === "approve" ? "ok" : "no");
      status.textContent = decision === "approve" ? "✓ 已批准执行" : "✕ 已拒绝";
      card.acts.replaceWith(status);

      const thinking = document.createElement("div");
      thinking.className = "thinking";
      thinking.innerHTML =
        '<span class="dots"><i></i><i></i><i></i></span><span>' +
        (decision === "approve" ? "正在执行操作…" : "正在处理…") +
        "</span>";
      turn.appendChild(thinking);

      setLoading(true);
      state.stick = true;
      scrollToBottom();

      try {
        const r = await runAgent(
          "/chat/resume",
          {
            thread_id: interrupt.thread_id,
            decision,
            message: decision === "reject" ? "用户拒绝了本次操作" : undefined,
          },
          turn,
          thinking
        );

        // 一次审批通过后可能又触发下一次写操作，继续弹卡片
        if (r.interrupt) showApproval(turn, r.interrupt);

        try {
          await loadSessions();
          const cur = state.sessions.find((x) => x.id === state.currentId);
          if (cur) el.chatTitle.textContent = cur.title;
          renderSessions();
        } catch (_) {}

      } catch (err) {
        if (thinking.isConnected) thinking.remove();
        const box = document.createElement("div");
        box.className = "content err";
        box.textContent = "执行失败：" + err.message;
        const row = document.createElement("div");
        row.className = "row";
        row.appendChild(box);
        turn.appendChild(row);
        toast("执行失败：" + err.message);
      } finally {
        setLoading(false);
        scrollToBottom();
        el.input.focus();
      }
    };

    card.approve.onclick = () => decide("approve");
    card.reject.onclick = () => decide("reject");
  }

  /* ============ 发送消息 ============ */
  async function send() {
    const text = el.input.value.trim();
    if (!text || state.loading) return;

    el.input.value = "";
    autoGrow();
    setLoading(true);
    removeWelcome();

    try {
      if (!state.currentId) {
        const created = await api("/sessions", { method: "POST", body: "{}" });
        state.currentId = created.id;
        localStorage.setItem("current_session", created.id);
        state.sessions.unshift(created);
        renderSessions();
      }

      const sid = state.currentId;

      const turn = document.createElement("div");
      turn.className = "turn";
      el.thread.appendChild(turn);

      const userRow = document.createElement("div");
      userRow.className = "row user";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      userRow.appendChild(bubble);
      turn.appendChild(userRow);

      const thinking = document.createElement("div");
      thinking.className = "thinking";
      thinking.innerHTML =
        '<span class="dots"><i></i><i></i><i></i></span><span>正在分析问题…</span>';
      turn.appendChild(thinking);

      state.stick = true;
      scrollToBottom(true);

      const r = await runAgent(
        "/chat/stream",
        { thread_id: sid, message: text },
        turn,
        thinking
      );

      if (r.interrupt) showApproval(turn, r.interrupt);

      try {
        await loadSessions();
        const cur = state.sessions.find((x) => x.id === sid);
        if (cur) el.chatTitle.textContent = cur.title;
        renderSessions();
      } catch (_) {}

    } catch (err) {
      const box = document.createElement("div");
      box.className = "content err";
      box.textContent = "请求失败：" + err.message;
      const row = document.createElement("div");
      row.className = "row";
      row.appendChild(box);
      el.thread.appendChild(row);
      toast("请求失败：" + err.message);
    } finally {
      setLoading(false);
      scrollToBottom();
      el.input.focus();
    }
  }
  function setLoading(on) {
    state.loading = on;
    el.send.disabled = on;
    el.input.disabled = on;
    el.newChat.disabled = on;
    el.send.textContent = on ? "…" : "↑";
  }

  el.send.onclick = send;

  /* ============ 启动 ============ */
  (async function boot() {
    // 主题优先级：URL 参数 > 本地存储 > 系统偏好
    // URL 参数用于分享"这个界面长这样"的链接，不污染用户自己的偏好设置
    const urlTheme = new URLSearchParams(location.search).get("theme");
    const storedTheme = localStorage.getItem("theme");
    const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;

    if (urlTheme === "light" || urlTheme === "dark") {
      applyTheme(urlTheme, false);
    } else {
      applyTheme(storedTheme || (prefersDark ? "dark" : "light"));
    }

    try {
      await loadSessions();
    } catch (err) {
      toast("无法加载会话列表：" + err.message);
    }

    renderSessions();

    // 支持 ?s=<会话ID> 直接定位到某个会话
    // 支持 ?new=1 跳过自动选中，直接开一个新对话（便于分享"新对话"入口链接）
    const params = new URLSearchParams(location.search);
    const isNew = params.get("new") === "1";
    const wanted = params.get("s");
    const saved = wanted || localStorage.getItem("current_session");
    const target = isNew
      ? null
      : (state.sessions.find((s) => s.id === saved) || state.sessions[0]);

    if (target) {
      await selectSession(target.id);
    } else {
      el.chatTitle.textContent = "新对话";
      showWelcome();
    }

    el.input.focus();
  })();
})();
</script>
